<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Sistema de alerta</h2>
<p id="estado">Sistema en espera...</p>

<script>

let ultimoToque = 0;
let contadorToques = 0;
let alertaActivada = false;

const tiempoEntreToques = 900;
const toquesNecesarios = 8;

const estado = document.getElementById("estado");

const enviarAlerta = () => {

    if(alertaActivada) return;

    alertaActivada = true;

    estado.innerText = "⚠️ ALERTA DE EMERGENCIA ACTIVADA";
    console.log("ALERTA ACTIVADA");
    alert("⚠️ ALERTA DE EMERGENCIA ACTIVADA");

};

// DETECCIÓN POR TOQUES
const detectarToques = () => {

    if(alertaActivada) return;

    const ahora = Date.now();

    if(ahora - ultimoToque <= tiempoEntreToques){
        contadorToques++;
    }else{
        contadorToques = 1;
    }

    ultimoToque = ahora;

    if(contadorToques >= toquesNecesarios){
        enviarAlerta();
    }

};

// RECONOCIMIENTO DE VOZ
const iniciarReconocimientoVoz = () => {

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        console.log("Reconocimiento de voz no soportado");
        return;
    }

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-ES";
    reconocimiento.continuous = true;
    reconocimiento.interimResults = false;

    // cuando realmente empieza a escuchar
    reconocimiento.onstart = () => {
        estado.innerText = "🎤 Escuchando...";
        console.log("Micrófono activo");
    };

    reconocimiento.onresult = (event) => {

        if(alertaActivada) return;

        const texto = event.results[event.results.length - 1][0].transcript.toLowerCase();

        console.log("Escuchado:", texto);

        if(
            texto.includes("alerta") ||
            texto.includes("ayuda") ||
            texto.includes("emergencia")
        ){
            enviarAlerta();
        }

    };

    reconocimiento.onerror = (error) => {

        console.log("Error voz:", error);

        // si se niega el permiso, seguir solo con toques
        if(error.error === "not-allowed"){
            estado.innerText = "Sistema activo (solo toques)";
        }

    };

    // reiniciar si el navegador lo detiene
    reconocimiento.onend = () => {
        if(!alertaActivada){
            reconocimiento.start();
        }
    };

    try{
        reconocimiento.start();
    }catch(e){
        console.log("No se pudo iniciar voz");
    }

};

// PREGUNTAR PERMISO AL INICIAR
window.onload = () => {

    estado.innerText = "Sistema activo 📱";

    const activarVoz = confirm("¿Deseas activar el reconocimiento por voz para emergencias?");

    if(activarVoz){

        // algunos navegadores requieren interacción del usuario
        document.addEventListener("touchstart", iniciarReconocimientoVoz, {once:true});

    }

};

// ACTIVAR DETECCIÓN DE TOQUES
document.addEventListener("touchstart", detectarToques);

</script>

</body>
</html>
