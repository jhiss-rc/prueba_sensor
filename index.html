<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Sistema de alerta</h2>
<p id="estado">Sistema en espera...</p>

<script>

let ultimoToque = 0;
let contadorToques = 0;

let alertaActivada = false;
let procesoAlerta = false;

const tiempoEntreToques = 900;
const toquesNecesarios = 8;

const estado = document.getElementById("estado");

const enviarAlerta = () => {

    estado.innerText = "⚠️ ALERTA DE EMERGENCIA ACTIVADA";
    console.log("ALERTA ACTIVADA");
    alert("⚠️ ALERTA DE EMERGENCIA ACTIVADA");

    // volver al estado normal sin reiniciar página
    procesoAlerta = false;
    alertaActivada = false;
    contadorToques = 0;

    estado.innerText = "Sistema activo 📱";

};


// ventana de cancelación
const confirmarAlerta = () => {

    if(procesoAlerta) return;

    procesoAlerta = true;

    estado.innerText = "⚠️ Alerta detectada. Esperando 10 segundos para enviar...";

    const cancelar = confirm(
        "⚠️ Se enviará una alerta en 10 segundos.\n\nPresiona CANCELAR si fue un error."
    );

    if(cancelar === false){

        estado.innerText = "Alerta cancelada";

        procesoAlerta = false;
        contadorToques = 0;

        return;
    }

    setTimeout(() => {

        alertaActivada = true;
        enviarAlerta();

    },10000);

};


// DETECCIÓN POR TOQUES
const detectarToques = () => {

    if(procesoAlerta) return;

    const ahora = Date.now();

    if(ahora - ultimoToque <= tiempoEntreToques){
        contadorToques++;
    }else{
        contadorToques = 1;
    }

    ultimoToque = ahora;

    if(contadorToques >= toquesNecesarios){
        confirmarAlerta();
    }

};


// RECONOCIMIENTO DE VOZ
const iniciarReconocimientoVoz = () => {

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        estado.innerText = "Reconocimiento de voz no soportado en este navegador";
        return;
    }

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-ES";
    reconocimiento.continuous = true;
    reconocimiento.interimResults = false;

    reconocimiento.onresult = (event) => {

        if(procesoAlerta) return;

        const texto = event.results[event.results.length - 1][0].transcript.toLowerCase();

        console.log("Escuchado:", texto);

        if(
            texto.includes("alerta") ||
            texto.includes("ayuda") ||
            texto.includes("emergencia")
        ){
            confirmarAlerta();
        }

    };

    reconocimiento.onerror = (error) => {
        console.log("Error de voz:", error);
    };

    reconocimiento.start();

};


// PREGUNTAR PERMISO SOLO AL CARGAR LA PÁGINA
window.onload = () => {

    estado.innerText = "Sistema activo 📱";

    const activarVoz = confirm("¿Deseas activar el reconocimiento por voz para emergencias?");

    if(activarVoz){
        iniciarReconocimientoVoz();
    }

};


// DETECCIÓN DE TOQUES
document.addEventListener("touchstart", detectarToques);

</script>

</body>
</html>
