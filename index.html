<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Sistema de alerta</h2>
<p id="estado">Sistema en espera...</p>

<script>

let ultimoMovimiento = 0;

let ultimoX = null;
let ultimoY = null;
let ultimoZ = null;

let ultimoToque = 0;
let contadorToques = 0;

const limiteSacudida = 12;   // sensibilidad controlada
const tiempoEspera = 4000;

const tiempoEntreToques = 1200;
const toquesNecesarios = 10;

const estado = document.getElementById("estado");

const enviarAlerta = () => {

    estado.innerText = "⚠️ ALERTA DE EMERGENCIA ACTIVADA";
    console.log("ALERTA DE EMERGENCIA ACTIVADA");

};

const detectarMovimiento = (event) => {

    const acc = event.accelerationIncludingGravity;
    if(!acc) return;

    const x = acc.x || 0;
    const y = acc.y || 0;
    const z = acc.z || 0;

    if(ultimoX === null){

        ultimoX = x;
        ultimoY = y;
        ultimoZ = z;
        return;

    }

    const delta =
        Math.abs(x - ultimoX) +
        Math.abs(y - ultimoY) +
        Math.abs(z - ultimoZ);

    ultimoX = x;
    ultimoY = y;
    ultimoZ = z;

    if(delta > limiteSacudida){

        const ahora = Date.now();

        if(ahora - ultimoMovimiento > tiempoEspera){

            ultimoMovimiento = ahora;
            enviarAlerta();

        }

    }

};

const detectarToques = () => {

    const ahora = Date.now();

    if(ahora - ultimoToque <= tiempoEntreToques){
        contadorToques++;
    }else{
        contadorToques = 1;
    }

    ultimoToque = ahora;

    estado.innerText = "Toques detectados: " + contadorToques;

    if(contadorToques >= toquesNecesarios){

        contadorToques = 0;
        enviarAlerta();

    }

};

const iniciarSensores = async () => {

    try{

        if(typeof DeviceMotionEvent !== "undefined" &&
           typeof DeviceMotionEvent.requestPermission === "function"){

            const permiso = await DeviceMotionEvent.requestPermission();

            if(permiso !== "granted"){
                estado.innerText = "Permiso de sensores denegado";
                return;
            }

        }

        window.addEventListener("devicemotion", detectarMovimiento);

        estado.innerText = "Sistema activo 📱";

    }
    catch(error){

        estado.innerText = "Error activando sensores";
        console.error(error);

    }

};

document.addEventListener("touchstart", detectarToques);

iniciarSensores();

</script>

</body>
</html>
