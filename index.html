<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Detector de alerta</h2>
<p id="estado">Esperando acción...</p>

<script>

let ultimoMovimiento = 0;
let ultimoToque = 0;
let contadorToques = 0;

const limiteMovimiento = 25;
const tiempoEspera = 4000;
const tiempoEntreToques = 600;
const toquesNecesarios = 3;

const estado = document.getElementById("estado");

const enviarAlerta = () => {

    estado.innerText = "🚨 ALERTA ACTIVADA";
    console.log("ALERTA ACTIVADA");

};

const detectarMovimiento = (event) => {

    const acc = event.accelerationIncludingGravity;

    if(!acc) return;

    const total =
        Math.abs(acc.x || 0) +
        Math.abs(acc.y || 0) +
        Math.abs(acc.z || 0);

    if(total > limiteMovimiento){

        const ahora = Date.now();

        if(ahora - ultimoMovimiento > tiempoEspera){

            ultimoMovimiento = ahora;
            enviarAlerta();

        }

    }

};

const detectarToques = () => {

    const ahora = Date.now();

    if(ahora - ultimoToque < tiempoEntreToques){
        contadorToques++;
    }else{
        contadorToques = 1;
    }

    ultimoToque = ahora;

    if(contadorToques >= toquesNecesarios){

        contadorToques = 0;
        enviarAlerta();

    }

};

const iniciarSensores = async () => {

    try{

        if(typeof DeviceMotionEvent !== "undefined" &&
           typeof DeviceMotionEvent.requestPermission === "function"){

            const permiso = await DeviceMotionEvent.requestPermission();

            if(permiso !== "granted"){
                estado.innerText = "Permiso de sensores denegado";
                return;
            }

        }

        window.addEventListener("devicemotion", detectarMovimiento);

        estado.innerText = "Sistema activo 📱";

    }
    catch(error){

        estado.innerText = "Error activando sensores";
        console.error(error);

    }

};

document.addEventListener("touchstart", detectarToques);
document.addEventListener("click", detectarToques);

iniciarSensores();

</script>

</body>
</html>
