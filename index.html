<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Sistema de alerta</h2>
<p id="estado">Sistema en espera...</p>

<h3>Contacto de emergencia</h3>

<input
type="text"
id="numeroContacto"
placeholder="Ej: 59171234567"
/>

<button onclick="agregarContacto()">
Agregar contacto
</button>

<ul id="listaContactos"></ul>

<div id="ventanaAlerta" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
color:white;
font-size:24px;
text-align:center;
padding-top:40%;
">

<p id="contadorTexto">⚠️ Enviando alerta en 10 segundos</p>

<button onclick="cancelarAlerta()" style="
font-size:20px;
padding:10px 20px;
margin-top:20px;
">
Cancelar
</button>

</div>

<script>

let ultimoToque = 0;
let contadorToques = 0;

let alertaEnProceso = false;

const tiempoEntreToques = 900;
const toquesNecesarios = 8;

const estado = document.getElementById("estado");

let temporizador = null;
let tiempo = 10;

let reconocimiento = null;
let vozActiva = false;

let contactos = [];

/* UBICACION GLOBAL */
let lat = null;
let lon = null;


/* ENVIAR ALERTA */
const enviarAlerta = () => {

if(contactos.length === 0){
alert("No hay contactos guardados");
return;
}

estado.innerText = "⚠️ ALERTA DE EMERGENCIA ACTIVADA";

const mensaje = `⚠️ ALERTA DE PELIGRO

La persona puede estar en riesgo.

Ubicación:
https://maps.google.com/?q=${lat},${lon}`;

contactos.forEach(numero => {

const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

window.open(url,"_blank");

});

alertaEnProceso = false;
contadorToques = 0;

};


/* CUENTA REGRESIVA */
const iniciarCuentaRegresiva = () => {

if(alertaEnProceso) return;

alertaEnProceso = true;

tiempo = 10;

document.getElementById("ventanaAlerta").style.display = "block";

temporizador = setInterval(()=>{

document.getElementById("contadorTexto").innerText =
"⚠️ Enviando alerta en " + tiempo + " segundos";

tiempo--;

if(tiempo < 0){

clearInterval(temporizador);

document.getElementById("ventanaAlerta").style.display = "none";

enviarAlerta();

}

},1000);

};


/* CANCELAR ALERTA */
const cancelarAlerta = () => {

clearInterval(temporizador);

document.getElementById("ventanaAlerta").style.display = "none";

alertaEnProceso = false;
contadorToques = 0;

estado.innerText = "Alerta cancelada";

};


/* DETECCION DE TOQUES */
const detectarToques = () => {

if(alertaEnProceso) return;

const ahora = Date.now();

if(ahora - ultimoToque <= tiempoEntreToques){
contadorToques++;
}else{
contadorToques = 1;
}

ultimoToque = ahora;

if(contadorToques >= toquesNecesarios){
iniciarCuentaRegresiva();
}

};


/* RECONOCIMIENTO DE VOZ */
const iniciarReconocimientoVoz = () => {

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
estado.innerText = "Reconocimiento de voz no soportado";
return;
}

reconocimiento = new SpeechRecognition();

reconocimiento.lang = "es-ES";
reconocimiento.continuous = true;

reconocimiento.onresult = (event) => {

const texto = event.results[event.results.length - 1][0].transcript.toLowerCase();

if(
texto.includes("alerta") ||
texto.includes("ayuda") ||
texto.includes("emergencia")
){
iniciarCuentaRegresiva();
}

};

reconocimiento.onend = () => {

if(vozActiva){
reconocimiento.start();
}

};

reconocimiento.start();

};


/* PEDIR PERMISOS AL INICIO */
window.onload = () => {

estado.innerText = "Sistema activo 📱";

/* preguntar por ubicación */

const activarUbicacion = confirm("¿Deseas habilitar la ubicación para emergencias?");

if(activarUbicacion){

navigator.geolocation.getCurrentPosition((pos)=>{

lat = pos.coords.latitude;
lon = pos.coords.longitude;

});

}

/* activar voz */
const activarVoz = confirm("¿Deseas activar el reconocimiento por voz para emergencias?");

if(activarVoz){

vozActiva = true;
iniciarReconocimientoVoz();

}

};


/* DETECTAR TOQUES */
document.addEventListener("touchstart", detectarToques);


/* AGREGAR CONTACTOS */
const agregarContacto = () => {

const numero = document.getElementById("numeroContacto").value;

if(numero==""){
alert("Ingresa un número");
return;
}

contactos.push(numero);

const li = document.createElement("li");
li.innerText = numero;

document.getElementById("listaContactos").appendChild(li);

document.getElementById("numeroContacto").value="";

};

</script>

</body>
</html>
