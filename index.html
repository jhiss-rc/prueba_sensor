<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Sistema de alerta</h2>
<p id="estado">Sistema en espera...</p>

<div id="ventanaAlerta" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
color:white;
font-size:24px;
text-align:center;
padding-top:40%;
">

<p id="contadorTexto">⚠️ Enviando alerta en 10 segundos</p>

<button onclick="cancelarAlerta()" style="
font-size:20px;
padding:10px 20px;
margin-top:20px;
">
Cancelar
</button>

</div>

<script>

let ultimoToque = 0;
let contadorToques = 0;

let alertaEnProceso = false;

const tiempoEntreToques = 900;
const toquesNecesarios = 8;

const estado = document.getElementById("estado");

let temporizador = null;
let tiempo = 10;

const enviarAlerta = () => {

    estado.innerText = "⚠️ ALERTA DE EMERGENCIA ACTIVADA";
    console.log("ALERTA ACTIVADA");
    alert("⚠️ ALERTA DE EMERGENCIA ACTIVADA");

    alertaEnProceso = false;
    contadorToques = 0;

    estado.innerText = "Sistema activo 📱";

};


// INICIAR CUENTA REGRESIVA
const iniciarCuentaRegresiva = () => {

    if(alertaEnProceso) return;

    alertaEnProceso = true;

    tiempo = 10;

    document.getElementById("ventanaAlerta").style.display = "block";

    temporizador = setInterval(()=>{

        document.getElementById("contadorTexto").innerText =
        "⚠️ Enviando alerta en " + tiempo + " segundos";

        tiempo--;

        if(tiempo < 0){

            clearInterval(temporizador);
            document.getElementById("ventanaAlerta").style.display = "none";

            enviarAlerta();

        }

    },1000);

};


// CANCELAR ALERTA
const cancelarAlerta = () => {

    clearInterval(temporizador);

    document.getElementById("ventanaAlerta").style.display = "none";

    alertaEnProceso = false;
    contadorToques = 0;

    estado.innerText = "Alerta cancelada";

};


// DETECCIÓN POR TOQUES
const detectarToques = () => {

    if(alertaEnProceso) return;

    const ahora = Date.now();

    if(ahora - ultimoToque <= tiempoEntreToques){
        contadorToques++;
    }else{
        contadorToques = 1;
    }

    ultimoToque = ahora;

    if(contadorToques >= toquesNecesarios){
        iniciarCuentaRegresiva();
    }

};


// RECONOCIMIENTO DE VOZ
const iniciarReconocimientoVoz = () => {

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        estado.innerText = "Reconocimiento de voz no soportado";
        return;
    }

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-ES";
    reconocimiento.continuous = true;
    reconocimiento.interimResults = false;

    reconocimiento.onresult = (event) => {

        if(alertaEnProceso) return;

        const texto = event.results[event.results.length - 1][0].transcript.toLowerCase();

        if(
            texto.includes("alerta") ||
            texto.includes("ayuda") ||
            texto.includes("emergencia")
        ){
            iniciarCuentaRegresiva();
        }

    };

    reconocimiento.start();

};


// PEDIR PERMISO SOLO AL CARGAR LA PÁGINA
window.onload = () => {

    estado.innerText = "Sistema activo 📱";

    const activarVoz = confirm("¿Deseas activar el reconocimiento por voz para emergencias?");

    if(activarVoz){
        iniciarReconocimientoVoz();
    }

};


// ACTIVAR DETECCIÓN DE TOQUES
document.addEventListener("touchstart", detectarToques);

</script>

</body>
</html>
