<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de alerta</title>
</head>

<body>

<h2>Sistema de alerta</h2>
<p id="estado">Sistema en espera...</p>

<script>

let ultimaMagnitud = 0;
let filtro = 0;

let ultimoToque = 0;
let contadorToques = 0;

let alertaActivada = false;
let ultimoMovimiento = 0;

// sensibilidad equilibrada entre celulares
const limiteSacudida = 3.5;

// evita múltiples activaciones seguidas
const tiempoMinMovimiento = 1200;

const tiempoEntreToques = 900;
const toquesNecesarios = 8;

const estado = document.getElementById("estado");

const enviarAlerta = () => {

    if(alertaActivada) return;

    alertaActivada = true;

    estado.innerText = "⚠️ ALERTA DE EMERGENCIA ACTIVADA";
    console.log("ALERTA ACTIVADA");

};

const detectarMovimiento = (event) => {

    if(alertaActivada) return;

    const acc = event.accelerationIncludingGravity;
    if(!acc) return;

    const x = acc.x || 0;
    const y = acc.y || 0;
    const z = acc.z || 0;

    // magnitud real del movimiento
    const magnitud = Math.sqrt(x*x + y*y + z*z);

    // diferencia respecto al último
    const delta = Math.abs(magnitud - ultimaMagnitud);

    ultimaMagnitud = magnitud;

    // filtro suavizado para eliminar ruido
    filtro = filtro * 0.8 + delta * 0.2;

    const ahora = Date.now();

    if(filtro > limiteSacudida && (ahora - ultimoMovimiento) > tiempoMinMovimiento){

        ultimoMovimiento = ahora;
        enviarAlerta();

    }

};

const detectarToques = () => {

    if(alertaActivada) return;

    const ahora = Date.now();

    if(ahora - ultimoToque <= tiempoEntreToques){
        contadorToques++;
    }else{
        contadorToques = 1;
    }

    ultimoToque = ahora;

    estado.innerText = "Toques detectados: " + contadorToques;

    if(contadorToques >= toquesNecesarios){

        enviarAlerta();

    }

};

const iniciarSensores = async () => {

    try{

        if(typeof DeviceMotionEvent !== "undefined" &&
           typeof DeviceMotionEvent.requestPermission === "function"){

            const permiso = await DeviceMotionEvent.requestPermission();

            if(permiso !== "granted"){
                estado.innerText = "Permiso de sensores denegado";
                return;
            }

        }

        window.addEventListener("devicemotion", detectarMovimiento);

        estado.innerText = "Sistema activo 📱";

    }
    catch(error){

        estado.innerText = "Error activando sensores";
        console.error(error);

    }

};

document.addEventListener("touchstart", detectarToques);

iniciarSensores();

</script>

</body>
</html>
